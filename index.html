<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A creature statistics and elemental vulnerability HUD for Owlbear Rodeo."
    />
    <title>Persona UI</title>
  </head>
  <body>
    <main class="panel">
      <p class="eyebrow">PERSONA UI</p>
      <h1>Elemental Affinities</h1>
      <p class="intro">
        View elemental affinities on tokens and manage them as the game master.
      </p>
      <section class="connection" aria-labelledby="connection-heading">
        <h2 id="connection-heading">Connection</h2>
        <p id="connection-status" role="status">
          Connecting to Owlbear Rodeo...
        </p>
      </section>
      <button id="notification-button" type="button" disabled>
        Test notification
      </button>
      <p class="hint">
        The element menu appears when the Element Hover tool is active.
      </p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
