<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <title>Owlbear Rodeo Extension Starter</title>
  </head>
  <body>
    <main class="panel">
      <h1>Extension starter</h1>
      <p class="intro">
        This is a starter template for building an extension for Owlbear Rodeo. It
        includes a basic UI and a connection to the Owlbear Rodeo SDK.
      </p>

      <section class="connection" aria-labelledby="connection-heading">
        <h2 id="connection-heading">Connection</h2>
        <p id="connection-status" role="status" aria-live="polite">
          Checking for Owlbear Rodeo…
        </p>
      </section>

      <button id="notification-button" type="button" disabled>
        Send test notification
      </button>

      <p class="hint">
        Edit <code>src/main.ts</code> to start customizing this extension.
      </p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
